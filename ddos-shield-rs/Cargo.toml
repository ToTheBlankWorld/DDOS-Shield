[package]
name = "ddos-shield"
version = "1.0.0"
edition = "2021"
description = "DDOS-Shield — Autonomous Cloud DDoS Detection, Mitigation, Recovery & Security Control Center"

[lib]
name = "ddos_shield"
path = "src/lib.rs"

[[bin]]
name = "ddos-shield"
path = "src/main.rs"
required-features = ["tui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The terminal UI deps are only used by the `ddos-shield` binary. Making them
# optional lets the library's test suite build without a terminal backend
# (and therefore without a mingw import-lib toolchain on some dev hosts).
ratatui = { version = "0.26", optional = true }
crossterm = { version = "0.27", optional = true }

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[profile.release]
opt-level = 2
codegen-units = 16
